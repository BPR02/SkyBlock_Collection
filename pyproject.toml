[project]
name = "skyvoid"
version = "1.0.0"
description = "SkyBlock Data Packs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beet>=0.115.0",
    "mecha>=0.103.0",
    "bolt>=0.50.1",
    "requests>=2.28.1",
]

[tool.uv]
dev-dependencies = [
    "black >= 22.6.0, < 23.0.0",
    "isort >= 5.10.1, < 6.0.0",
    "uv >= 0.5.4",
]

[tool.beet]

[tool.pyright]
typeCheckingMode = "strict"

[tool.isort]
profile = "black"
